name: Update _laatste_update catalogus

on:
  schedule:
    - cron: "0 6 * * 0" # elke zondag 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check en update _laatste_update
        run: uv run python scripts/update_laatste_update.py

      - name: Sync naar docs/ en src/ als JSON gewijzigd
        run: |
          if ! git diff --quiet data/02-prepared/cbs_datasets_ai.json; then
            cp data/02-prepared/cbs_datasets_ai.json docs/data.json
            cp data/02-prepared/cbs_datasets_ai.json src/onderwijsdata/data/cbs_datasets_ai.json
          fi

      - name: Commit en push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/02-prepared/cbs_datasets_ai.json docs/data.json src/onderwijsdata/data/cbs_datasets_ai.json
          git diff --staged --quiet || (
            GEWIJZIGD=$(git diff --cached data/02-prepared/cbs_datasets_ai.json | grep '^+.*_laatste_update' | wc -l | tr -d ' ')
            git commit -m "chore: update _laatste_update (${GEWIJZIGD} datasets) [$(date +%Y-%m-%d)]"
            git push
          )
